<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Management Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Animal Management System</h1>
        
        <!-- Add Animal Form -->
        <div class="card">
            <h2>Add New Animal</h2>
            <form id="animal-form">
                <div class="form-group">
                    <label for="name">Animal Name:</label>
                    <input type="text" id="name" required placeholder="e.g., Lion">
                </div>
                <div class="form-group">
                    <label for="numLegs">Number of Legs:</label>
                    <input type="number" id="numLegs" required placeholder="e.g., 4">
                </div>
                <button type="submit" class="btn-primary">Add Animal</button>
            </form>
            <div id="form-message" class="message"></div>
        </div>

        <!-- Edit Animal Form -->
        <div class="card" id="edit-card">
            <h2>Edit Animal</h2>
            <form id="edit-form">
                <input type="hidden" id="edit-id">
                <div class="form-group">
                    <label for="edit-name">Animal Name:</label>
                    <input type="text" id="edit-name" required>
                </div>
                <div class="form-group">
                    <label for="edit-numLegs">Number of Legs:</label>
                    <input type="number" id="edit-numLegs" required>
                </div>
                <button type="submit" class="btn-secondary">Save Changes</button>
                <button type="button" class="btn-danger" onclick="cancelEdit()">Cancel</button>
            </form>
        </div>

        <!-- Search and Filter -->
        <div class="card">
            <h2>Search & Filter</h2>
            
            <div class="search-row">
                <input type="number" id="searchId" placeholder="Search by ID...">
                <button onclick="searchById()" class="btn-primary">Search ID</button>
            </div>

            <div class="search-row">
                <input type="text" id="searchName" placeholder="Search by Animal Name...">
                <button onclick="searchByName()" class="btn-primary">Search Name</button>
            </div>

            <div class="search-row no-margin">
                <input type="number" id="filterLegs" placeholder="Filter by Legs...">
                <button onclick="filterByLegs()" class="btn-primary">Filter Legs</button>
                <button onclick="fetchAnimals()" class="btn-neutral">Reset / Show All</button>
            </div>
            
            <div id="search-message" class="message"></div>
        </div>

        <!-- Animal List Section -->
        <div class="card">
            <h2>Animal Directory</h2>
            <div id="loading">Loading animals...</div>
            <table id="animal-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Legs</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="animal-list">
                    <!-- Data injected dynamically -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
