<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal API Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container auth-container">
        <h1 style="text-align: center; margin-bottom: 20px;">Animal Management System</h1>
        
        <div class="card">
            <h2>Login</h2>
            <form id="login-form">
                <div class="form-group">
                    <label>Email</label>
                    <input id="email" type="email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input id="password" type="password" required>
                </div>
                <button type="submit" id="login-btn" class="btn-primary" style="width: 100%;">Log in</button>
            </form>
            
            <!-- NEW: The simple text loading div -->
            <div id="loading" style="display: none; text-align: center; margin-top: 15px; font-weight: bold; color: var(--text-muted);">Logging in...</div>
            
            <p id="message" class="message"></p>
            
            <div class="auth-link">
                <a href="./register.html">Don't have an account? Register here.</a>
            </div>
        </div>
    </div>
    <script type="module" src="./login.js"></script>
</body>
</html>
