    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal API Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container auth-container">
        <h1 style="text-align: center; margin-bottom: 20px;">Animal Management System</h1>
        
        <div class="card">
            <h2>Create an Account</h2>
            <form id="register-form">
                <div class="form-group">
                    <label>Full Name</label>
                    <input id="name" type="text" required placeholder="e.g., Juan Dela Cruz">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input id="email" type="email" required placeholder="e.g., juan@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <!-- Minlength set to 8 to match your backend rules -->
                    <input id="password" type="password" required minlength="8" placeholder="At least 8 characters">
                </div>
                <button type="submit" class="btn-primary" style="width: 100%;">Register</button>
            </form>
            
            <p id="message" class="message"></p>
            
            <div class="auth-link">
                <a href="./login.html">Already have an account? Log in here.</a>
            </div>
        </div>
    </div>
    <script type="module" src="./register.js"></script>
</body>
</html>
